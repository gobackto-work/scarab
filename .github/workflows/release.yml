name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The agent image carries the bridge and the platform-tools extension. The
          # entrypoint script and the extension are tracked files; only the bridge
          # binary is compiled.
          - name: scarab-agent
            context: image/agent
            output: image/agent/scarab-bridge
            package: bridge
          - name: scarab-broker
            context: image/broker
            output: image/broker/scarab-broker
            package: broker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # The images are static binaries and nothing else, so the Dockerfiles COPY a
      # binary rather than building one. Cross-compile into the build context first,
      # exactly as cluster-setup-scripts/load-image.sh does.
      - name: Cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o ${{ matrix.output }} ./cmd/${{ matrix.package }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          # arm64 is free on public repositories, via the native ubuntu-24.04-arm
          # runner. Add it as `linux/amd64,linux/arm64` with a matrix when a reason
          # appears; the cluster is amd64 today.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

