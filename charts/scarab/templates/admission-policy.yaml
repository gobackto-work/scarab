{{- if .Values.admissionPolicies.enabled }}
# Platform-specific pod invariants that Pod Security Admission cannot express.
#
# PSA `restricted` covers container hardening: privileged, hostNetwork, hostPath,
# root users, capabilities, seccomp. It says nothing about:
#
#   - spec.serviceAccountName   (a pod may use `default`, which AUTO-MOUNTS an API
#                                token, violating the invariant that no Pi container
#                                holds a credential)
#   - spec.automountServiceAccountToken: true
#   - spec.nodeName             (bypasses the scheduler)
#   - spec.runtimeClassName
#   - arbitrary volume types
#
# These are the second layer behind the broker. They apply to everything creating
# pods in a tenant namespace -- INCLUDING the broker itself -- so the invariants
# hold even if the broker is compromised.
#
# Matching is by the namespace label the provisioner sets, not by a "ws-" string
# prefix, so renaming never silently disables enforcement.
#
# Three policies are needed because one rule set cannot cover every shape: bare
# pods, workload pod templates (admitted as Jobs, so a violation would otherwise
# surface late and confusingly), and pods/ephemeralcontainers (kubectl debug).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-pod-invariants
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        has(object.spec.serviceAccountName) &&
        object.spec.serviceAccountName in ['pi-root', 'pi-worker']
      message: >-
        tenant pods must set serviceAccountName to an allowlisted identity
        (pi-root or pi-worker); the default ServiceAccount is not permitted
        because it mounts an API token
    - expression: >-
        !has(object.spec.automountServiceAccountToken) ||
        object.spec.automountServiceAccountToken == false
      message: "tenant pods must not request a Kubernetes API token"
    # nodeName is set by the SCHEDULER on every pod that actually runs, so a bare
    # !has(nodeName) also denies every UPDATE to a scheduled pod. That blocked the
    # Job controller's orphan-pod cleanup and the job-tracking finalizer, so a
    # failed worker stuck in Terminating forever and leaked the pod budget. Deny it
    # on CREATE, and on UPDATE only when it CHANGES.
    - expression: >-
        request.operation == 'CREATE'
          ? !has(object.spec.nodeName)
          : (!has(object.spec.nodeName) ||
             (has(oldObject.spec.nodeName) && object.spec.nodeName == oldObject.spec.nodeName))
      message: "tenant pods must not pin a node via spec.nodeName"
    - expression: "!has(object.spec.runtimeClassName)"
      message: "tenant pods must not select a RuntimeClass"
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v,
          has(v.persistentVolumeClaim) || has(v.emptyDir) || has(v.secret) ||
          has(v.configMap) || has(v.projected) || has(v.downwardAPI) ||
          has(v.ephemeral))
      message: >-
        tenant pods may only mount persistentVolumeClaim, emptyDir, secret,
        configMap, projected, downwardAPI or ephemeral volumes
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-pod-invariants
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  policyName: tenant-pod-invariants
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: agents.gobackto.work/workspace
          operator: Exists
---
# Workload templates. The broker creates Jobs, so validating only pods would let a
# violating template in and fail later, at pod-creation time, with an error
# attributed to the controller rather than the submitter.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-workload-template-invariants
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  variables:
    # CronJob nests its pod template one level deeper than everything else.
    - name: podSpec
      expression: >-
        request.resource.resource == 'cronjobs'
          ? object.spec.jobTemplate.spec.template.spec
          : object.spec.template.spec
  validations:
    - expression: >-
        has(variables.podSpec.serviceAccountName) &&
        variables.podSpec.serviceAccountName in ['pi-root', 'pi-worker']
      message: >-
        tenant workload pod templates must set serviceAccountName to an
        allowlisted identity (pi-root or pi-worker)
    - expression: >-
        !has(variables.podSpec.automountServiceAccountToken) ||
        variables.podSpec.automountServiceAccountToken == false
      message: "tenant workload pod templates must not request a Kubernetes API token"
    - expression: "!has(variables.podSpec.nodeName)"
      message: "tenant workload pod templates must not pin a node via spec.nodeName"
    - expression: "!has(variables.podSpec.runtimeClassName)"
      message: "tenant workload pod templates must not select a RuntimeClass"
    # Without this the pod policy is the only volume check, so a Job carrying a
    # hostPath volume is admitted here and only rejected later, at pod creation,
    # with an error attributed to the controller rather than the submitter.
    - expression: >-
        !has(variables.podSpec.volumes) ||
        variables.podSpec.volumes.all(v,
          has(v.persistentVolumeClaim) || has(v.emptyDir) || has(v.secret) ||
          has(v.configMap) || has(v.projected) || has(v.downwardAPI) ||
          has(v.ephemeral))
      message: >-
        tenant workload pod templates may only mount persistentVolumeClaim,
        emptyDir, secret, configMap, projected, downwardAPI or ephemeral volumes
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-workload-template-invariants
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  policyName: tenant-workload-template-invariants
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: agents.gobackto.work/workspace
          operator: Exists
---
# kubectl debug injects ephemeral containers through a subresource that a policy on
# `pods` does not match. It is exec-adjacent, and the platform deliberately does not
# grant pods/exec, so deny it outright in tenant namespaces.
#
# PSA already blocks the DEFAULT debugger, because kubectl debug's `legacy` profile
# does not set allowPrivilegeEscalation=false or drop capabilities. But
# `--profile=restricted` satisfies PSA, and this policy is then the only thing
# standing in the way.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-deny-ephemeral-containers
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  validations:
    - expression: "false"
      message: >-
        ephemeral containers (kubectl debug) are not permitted in tenant
        namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-deny-ephemeral-containers
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  policyName: tenant-deny-ephemeral-containers
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: agents.gobackto.work/workspace
          operator: Exists
{{- end }}
