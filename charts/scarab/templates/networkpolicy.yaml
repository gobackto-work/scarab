{{- if .Values.networkPolicy.enabled }}
{{- $ns := include "scarab.namespace" . }}
# The broker is the only tenant-side component that talks to the Kubernetes API, and
# it holds a namespace-scoped Role in one tenant namespace. It has exactly two
# needs, so both directions are default-deny with a named allow:
#
#   ingress  its own workspace's root agent, on the broker port
#   egress   cluster DNS, and the Kubernetes API server
#
# Egress is a CiliumNetworkPolicy for the API server, for the same reason as
# pestilence's: kube-proxy DNATs the `kubernetes` Service to the node, so an ipBlock
# naming the ClusterIP or the node matches nothing and the broker silently times
# out. `kube-apiserver` is exactly the API server; `host` would also permit
# everything else on the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-workspaces
  namespace: {{ $ns }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # The workspace label is set by pestilence on the tenant namespace and
        # cannot be added by a tenant, so this cannot reach another workspace's
        # broker.
        - namespaceSelector:
            matchExpressions:
              - key: agents.gobackto.work/workspace
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.brokerPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: {{ $ns }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-kube-apiserver
  namespace: {{ $ns }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  endpointSelector: {}
  egress:
    - toEntities: [kube-apiserver]
{{- end }}
